# Sync version tags from apache/superset to this fork so git describe can
# resolve the upstream version without manual intervention.
name: Sync upstream tags

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0

      - name: Fetch and push upstream version tags
        run: |
          git remote add upstream https://github.com/apache/superset.git
          git fetch upstream 'refs/tags/[0-9]*.[0-9]*.[0-9]*:refs/tags/[0-9]*.[0-9]*.[0-9]*'
          git push origin --tags
