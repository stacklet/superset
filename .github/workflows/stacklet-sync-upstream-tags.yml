# Sync version tags from apache/superset to this fork so git describe can
# resolve the upstream version without manual intervention.
name: Stacklet sync upstream tags

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  sync-tags:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HARDEN_RUNNER: ${{ secrets.STEP_SECURITY_API_KEY != '' }}
    steps:
      - name: Harden Runner
        if: env.HARDEN_RUNNER == 'true'
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          use-policy-store: true
          api-key: ${{ secrets.STEP_SECURITY_API_KEY }}

      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          # GITHUB_TOKEN cannot push tags referencing commits that contain
          # workflow files. Requires a classic PAT with repo+workflow scopes.
          token: ${{ secrets.TAGS_SYNC_PAT }}

      - name: Fetch and push upstream version tags
        run: |
          git remote add upstream https://github.com/apache/superset.git
          git fetch upstream --tags
          git tag -l '[0-9]*.[0-9]*.[0-9]*' \
            | xargs -r git push origin --force-with-lease
